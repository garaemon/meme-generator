name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    # Expose the token as env because the secrets context is not allowed in
    # step-level if conditions.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.node-version'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm run test:coverage

    # The static export fails to build on things tests do not catch, such as a
    # new Route Handler. Catch them here instead of in Workers Builds after merge.
    - name: Build static export
      run: npm run build

    - name: Validate Worker bundle and wrangler config
      run: npx wrangler deploy --dry-run --outdir=.wrangler/dry-run

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run E2E tests
      run: npm run test:e2e

    - name: Upload coverage to Codecov
      if: ${{ env.CODECOV_TOKEN != '' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ env.CODECOV_TOKEN }}
        slug: garaemon/meme-generator
